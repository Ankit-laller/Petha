<main class="page-shell">
  <div class="ambient ambient-one">♥</div>
  <div class="ambient ambient-two">♥</div>

  <header class="hero">
    <p class="eyebrow">For my favourite person</p>
    <h1>Hey <span>{{name}}</span> <b>💕</b></h1>
  </header>

  <article class="card">
    <p class="message">{{message}}</p>
    <div class="meta">
      <span>Our little forever began</span>
      <strong>{{ days }}</strong>
      <span>days ago</span>
    </div>
    <button class="surprise" (click)="playConfetti()">
      <span>Send a sky full of love</span>
      <span aria-hidden="true">🎉</span>
    </button>
  </article>

  <app-love-question></app-love-question>
</main>
